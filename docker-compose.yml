services:
  wordcore:
    build:
      context: .         # project root — gives Dockerfile access to both src/ and api/
      dockerfile: api/Dockerfile
      args:
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
    container_name: wordcore
    restart: unless-stopped
    user: "1001:1001"        # owner of ./content, which the app writes voice clips into
    ports:
      - "127.0.0.1:7081:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - MIMO_API_KEY=${MIMO_API_KEY}
      - DOUBAO_TTS_API_KEY=${DOUBAO_TTS_API_KEY}
      - TTS_PROVIDER=${TTS_PROVIDER:-mimo}
      - TTS_VOICE=${TTS_VOICE:-Mia}
      - TTS_DAILY_CAP=${TTS_DAILY_CAP:-500}
      - PORT=8080
      - STATIC_DIR=/app/static
      - CONTENT_DIR=/app/content
      - TZ=Asia/Shanghai
    volumes:
      - ./content:/app/content   # generated by scripts/content (cards, audio)
    networks:
      - proxy-network
      - db-sync-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  proxy-network:
    external: true
  db-sync-net:
    external: true
